# Host the game on GitHub Pages (ticket 28). Runs on every push to main, or by hand.
# One-time setup: Settings → Pages → Source: GitHub Actions. Pages needs the repo to be public
# (or a paid plan). The game is then at https://<owner>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      # Assets load from import.meta.env.BASE_URL, so the game works under /<repo>/.
      - run: npx tsc --noEmit && npx vite build --base="/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
